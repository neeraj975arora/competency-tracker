name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest (tests/test_app.py)
        run: python -m pytest tests/test_app.py -q

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    env:
      HEADLESS: "1"
      BROWSER_CHANNEL: ""   # use Playwright's bundled Chromium on the runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests (tests/e2e)
        run: python -m pytest tests/e2e -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env for the test
        run: |
          {
            echo "JWT_SECRET=ci-$(openssl rand -hex 32)"
            echo "ALLOWED_EMAIL_DOMAIN=impressico.com"
            echo "TOKEN_HOURS=8"
            echo "COOKIE_SECURE=0"
          } > .env

      - name: Build the image
        run: docker compose build

      - name: Start the container
        run: docker compose up -d

      - name: Wait for the sign-in page
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/login > /dev/null; then
              echo "App is responding after $i attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond. Container logs:"
          docker compose logs tracker
          exit 1

      - name: Check the sign-in page content
        run: curl -fsS http://127.0.0.1:5000/login | grep -q "Sign in"

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Stop and remove the container
        if: always()
        run: docker compose down -v
